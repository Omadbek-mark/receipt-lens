[project]
name = "receipt-lens"
version = "0.2.0"
description = "ReceiptLens: multilingual AI receipt scanning, translation and personal expenses."
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["outputs", "data", "benchmarks/results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
