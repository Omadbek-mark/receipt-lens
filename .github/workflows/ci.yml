name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# PR runs may be replaced; a production push may already be deploying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/requirements-linux.txt
      # The Linux list is the deployed dependency set; tests mock OCR and Gemini.
      - run: python -m pip install -r deploy/requirements-linux.txt pytest==8.4.2 ruff==0.17.3
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m pip check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --platform linux/amd64 --tag receipt-lens:ci .

  deploy:
    needs: [validate, docker-build]
    # Skipped (not failed) until the Coolify variables exist.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.COOLIFY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.SMOKE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
    steps:
      - name: Start the Coolify deployment
        id: start
        run: |
          set -euo pipefail
          # Coolify 4.4+ accepts only POST for this endpoint.
          if ! response=$(curl -sS --fail-with-body --connect-timeout 15 --max-time 30 \
            --retry 4 --retry-delay 10 -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID&force=false"); then
            echo "::error::Coolify refused the deploy request: $response"
            exit 1
          fi
          echo "$response"
          deployment=$(jq -r '.deployments[0].deployment_uuid // empty' <<<"$response")
          if [ -z "$deployment" ]; then
            echo "::error::Coolify accepted the request but returned no deployment id."
            exit 1
          fi
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"

      - name: Wait for Coolify to finish
        env:
          DEPLOYMENT: ${{ steps.start.outputs.deployment }}
        run: |
          set -euo pipefail
          # The PaddleOCR image build is slow on a shared 2 vCPU server.
          deadline=$((SECONDS + 40 * 60))
          while :; do
            if ! body=$(curl -sS --fail-with-body --connect-timeout 15 --max-time 30 \
              --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deployments/$DEPLOYMENT"); then
              echo "::error::Could not read the status of deployment $DEPLOYMENT: $body"
              exit 1
            fi
            status=$(jq -r '.status' <<<"$body")
            echo "$(date -u +%H:%M:%S) $status"
            case "$status" in
              finished) exit 0 ;;
              failed | cancelled*)
                echo "::error::Coolify deployment $DEPLOYMENT ended as '$status'."
                exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Deployment did not finish within 40 minutes (last: '$status')."
              exit 1
            fi
            sleep 15
          done

      # HTTP 200 proves only that Streamlit answers, not that OCR models work.
      - name: Smoke test
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SMOKE_URL")
            echo "attempt $attempt: HTTP $code"
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::$SMOKE_URL did not answer 200 after the deployment finished."
          exit 1
